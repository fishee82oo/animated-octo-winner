provider: Open-Meteo / DWD ICON Global
endpoint: https://previous-runs-api.open-meteo.com/v1/forecast
model: icon_global
lead_days: 2
availability_delay_hours: 8
default_start: '2024-04-01'
default_end: '2025-12-31'
documentation: https://open-meteo.com/en/docs/previous-runs-api
sampling_note: Equal-weight illustrative geographic proxies, not demand or installed-capacity weights. Coordinates are approximate; no claim of full bidding-zone coverage.
variables:
  temperature_2m: [temperature_c, '°C']
  wind_speed_100m: [wind_100m_ms, 'm/s']
  cloud_cover: [cloud_pct, '%']
  shortwave_radiation_instant: [radiation_wm2, 'W/m²']
  precipitation: [precipitation_mm, mm]
